<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #5dc1b9 0%, #7ff3e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .welcome-container {
            background: #FFFFFF;
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-icon {
            background: rgba(93, 193, 185, 0.1);
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        h1 {
            color: #5dc1b9;
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 20px;
        }

        p {
            color: #6c757d;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            background: #5dc1b9;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #7ff3e9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(93, 193, 185, 0.3);
        }

        .btn-back {
            background: transparent;
            color: #6c757d;
            border: 2px solid #e9ecef;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .btn-back:hover {
            background: #f8f9fa;
            border-color: #5dc1b9;
            color: #5dc1b9;
            transform: translateY(-1px);
        }

        .btn-back i {
            margin-right: 8px;
        }

        @media (max-width: 576px) {
            .welcome-container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 36px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-icon">
            👋
        </div>
        <h1>Bienvenido</h1>
        <p>Nos alegra tenerte aquí. Estás a punto de comenzar una experiencia increíble.</p>
        <button class="btn" onclick="alert('¡Hola! Bienvenido a la plataforma')">Comenzar</button>
        <br>
        <a href="login.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>Cerrar sesión
        </a>
    </div>
</body>
</html>
